name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'phase/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build
