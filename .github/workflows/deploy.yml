name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://justini0715.github.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install, build, and deploy
        uses: withastro/action@v5
        with:
          node-version: 24
          package-manager: npm
